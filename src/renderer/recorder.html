<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- окно чтения вслух: единственное, которому нужен blob: — синтезированный
         звук приходит буфером и играется через URL.createObjectURL -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Verbo для Оли Recorder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/recorder.ts"></script>
  </body>
</html>
