<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- в окно попадает чужой текст (речь, чужое выделение, ответы модели, распознанное
         с картинки): запрещаем всё, кроме собственных файлов. 'unsafe-inline' нужен
         только для стилей — в разметке есть style={{…}} и встроенный <style> -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Verbo Overlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
